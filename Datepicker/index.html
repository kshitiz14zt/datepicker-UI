<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <title>DatePicker</title>
</head>
<body>
    <div class="Container">
        <div class="parent lato-regular">
            <input type="number" class="date-picker" placeholder="dd / mm / yyyy" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}">
            <button class="calendar-button"><img class="calendar-img" src="images/calendar.png" alt=""></button>
        </div>
        <div class="calendar">
            <div class="calendar-head">
                <i class="fa-solid fa-caret-left"></i>
                <span class="months">December 2022</span>
                <i class="fa-solid fa-caret-right"></i>
            </div>
            <div class="calendar-days">
                <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
            </div>
            <div class="calendar-dates">
                <div></div><div></div><div></div><div></div><div><p>1</p></div><div><p>2</p></div>
                <div><p>3</p></div><div><p>4</p></div><div><p>5</p></div><div><p>6</p></div><div><p>7</p></div><div><p>8</p></div><div><p>9</p></div>
                <div><p>10</p></div><div><p>11</p></div><div><p>12</p></div><div><p>13</p></div><div><p>14</p></div><div><p>15</p></div><div><p>16</p></div>
                <div><p>17</p></div><div><p>18</p></div><div><p>19</p></div><div><p>20</p></div><div><p>21</p></div><div><p>22</p></div><div><p>23</p></div><div><p>24</p></div>
                <div><p>25</p></div><div><p>26</p></div><div><p>27</p></div><div><p>28</p></div><div><p>29</p></div><div><p>30</p></div><div><p>31</p></div>
            </div>
        </div>
    </div>    
</body>
</html>
