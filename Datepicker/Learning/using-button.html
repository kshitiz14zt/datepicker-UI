<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .Container {
      padding: 26px 40px 40px 40px;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2), 0 6px 20px rgba(0, 0, 0, 0.19);
      margin: 20px auto;
    }

    .parent {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .date-picker {
      width: 78%;
      height: 60px;
      border: 2px solid black;
      font-size: 2em;
      padding-left: 18px;
      border-right: 0;
    }

    ::placeholder {
      color: black;
      font-size: 1em;
      font-family: "Lato";
    }

    .calendar-button {
      width: 72px;
      border: 2px solid black;
      cursor: pointer;
    }

    .calendar-img {
      width: 34px;
    }

    .calendar {
      position: relative;
      border: 2px solid #333;
      width: 99%;
      margin-top: 4px;
    }

    .calendar-head {
      margin-top: 10px;
    }

    .fa-caret-right,
    .fa-caret-left {
      position: absolute;
      top: 2px;
      font-size: 3em;
    }

    .fa-caret-right {
      right: 18px;
    }

    .fa-caret-left {
      left: 18px;
    }

    .months {
      font-family: "Lato";
      font-size: 26px;
      padding-left: 26%;
    }

    .calendar-dates,
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .calendar-days {
      border-bottom: 3px solid #000;
      padding-bottom: 4px;
      font-weight: bold;
      margin-top: 10px;
    }

    /* .calendar-dates div {
      padding: 6px;
      border-bottom: 2px solid rgb(99, 98, 98);
      border-right: 2px solid rgb(110, 109, 109);
    } */
    .calendar-dates button:hover {
      background: red;
      /* border-radius: 50%; */
      cursor: pointer;
    }

    .calendar-dates button {
      height: 22px;
      border-bottom: 1px solid rgb(99, 98, 98);
      border-right: 1px solid rgb(99, 98, 98);
      border-top: 0px;
      border-left: 0px;
      font-size: 14px;
    }

    @media screen and (min-width: 768px) {
      .parent {
        height: 4em;
      }
      .date-picker {
        width: 88%;
      }
      .calendar-button {
        width: 12%;
      }
      .calendar {
        width: 99.5%;
        margin-top: 10px;
      }
      .fa-caret-left,
      .fa-caret-right {
        font-size: 4em;
        top: 4px;
      }
      .months {
        font-size: 42px;
      }
      ::placeholder {
        font-size: 34px;
      }
      .date-picker {
        height: auto;
      }
      /* .calendar-dates div {
        font-size: 30px;
      } */
      .calendar-days div {
        font-size: 30px;
      }
      .calendar-days {
        margin-top: 24px;
      }
      .calendar-dates button :nth-child(29),
      .calendar-dates button :nth-child(30),
      .calendar-dates button :nth-child(31),
      .calendar-dates button :nth-child(32),
      .calendar-dates button :nth-child(33),
      .calendar-dates button :nth-child(34) {
        border-bottom: 0;
      }
      .calendar-dates button :nth-child(7n) {
        border-right: 0;
      }
    }

    @media screen and (min-width: 1024px) {
      .Container {
        max-width: 720px;
        margin: 80px auto;
      }
    }
  </style>
  <title>DatePicker</title>
</head>
<body>
  <div class="Container">
    <div class="parent lato-regular">
      <input type="text" class="date-picker" placeholder="dd / mm / yyyy" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" />
      <button class="calendar-button"><img class="calendar-img" src="images/calendar.png" alt="" /></button>
    </div>
    <div class="calendar">
      <div class="calendar-head">
        <i class="fa-solid fa-caret-left"></i>
        <span class="months">December 2022</span>
        <i class="fa-solid fa-caret-right"></i>
      </div>
      <div class="calendar-days">
        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
      </div>
      <div class="calendar-dates">
        <button></button><button></button><button></button><button></button><button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>10</button>
        <button>11</button><button>12</button><button>13</button><button>14</button><button>15</button><button>16</button><button>17</button>
        <button>18</button><button>19</button><button>20</button><button>21</button><button>22</button><button>23</button><button>24</button>
        <button>25</button><button>26</button><button>27</button><button>28</button><button>29</button><button>30</button><button>31</button>
      </div>
    </div>
  </div>
</body>
</html>
